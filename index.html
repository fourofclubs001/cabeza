<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#13141b">
<meta name="description" content="Cabeza — a 3D two-player rolling-block board game. Roll your blocks, crush the cabeza.">
<title>Cabeza</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><ellipse cx='16' cy='20' rx='14' ry='6' fill='%23db2930'/><ellipse cx='16' cy='15' rx='6' ry='6' fill='%23ffc747'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl"></canvas>

<header id="top"><div id="title"></div><div id="hint"></div></header>

<nav id="liveBar" class="bar">
  <button class="btn" id="undoBtn" style="flex:1">↶ Undo</button>
  <button class="btn" id="endBtn" style="flex:1.4">End turn</button>
  <button class="btn" id="menuBtn" style="flex:.8">Menu</button>
  <button class="btn" id="helpBtn" style="flex:.5" aria-label="Rules">?</button>
</nav>

<nav id="replayBox" hidden>
  <div id="counter"></div>
  <div class="bar">
    <button class="btn" id="firstBtn" style="flex:1" aria-label="First">⏮</button>
    <button class="btn" id="prevBtn" style="flex:1.3" aria-label="Previous">◀</button>
    <button class="btn" id="nextBtn" style="flex:1.3" aria-label="Next">▶</button>
    <button class="btn" id="lastBtn" style="flex:1" aria-label="Last">⏭</button>
  </div>
  <div class="bar">
    <button class="btn" id="realBtn" style="flex:1.2">↩ Real game</button>
    <button class="btn" id="whatIfBtn" style="flex:1.2">Both sides</button>
    <button class="btn" id="rEndBtn" style="flex:1">End turn</button>
    <button class="btn" id="rMenuBtn" style="flex:.8">Menu</button>
  </div>
</nav>

<div id="flash"></div>

<div id="winBox" hidden>
  <div id="winText"></div>
  <button class="btn" id="againBtn">Play again</button>
  <button class="btn" id="reviewBtn">Review game</button>
  <button class="btn" id="winMenuBtn">Menu</button>
</div>

<section id="menu" class="screen">
  <h1>CABEZA</h1>
  <p class="tag">roll your blocks · crush the cabeza</p>
  <div class="menuList">
    <button class="btn wide" id="resumeBtn" hidden>Resume game</button>
    <button class="btn wide" id="cpuBtn">Play vs CPU</button>
    <button class="btn wide" id="pvpBtn">2 players · pass &amp; play</button>
    <button class="btn wide" id="gamesBtn">Previous games</button>
    <button class="btn wide" id="rulesBtn">Rules</button>
  </div>
</section>

<section id="games" class="screen" hidden>
  <div class="gamesHead"><button class="btn" id="backBtn">← Back</button><h2>Previous games</h2></div>
  <div id="gamesList"></div>
</section>

<div id="dialog" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h3 id="dlgTitle"></h3>
    <div id="dlgBody"></div>
    <div id="dlgFoot"></div>
  </div>
</div>

<script src="game.js"></script>
<script src="bot.js"></script>
<script src="main.js"></script>
</body>
</html>
